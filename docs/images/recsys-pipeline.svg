<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="'Noto Sans CJK SC','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f0883e"/>
    </marker>
    <marker id="arrowG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1240" height="840" fill="#0d1117"/>

  <!-- 标题 -->
  <text x="620" y="44" fill="#e6edf3" font-size="26" font-weight="700" text-anchor="middle">短视频平台推荐流流水线（MVP）</text>
  <text x="620" y="72" fill="#8b949e" font-size="14" text-anchor="middle">候选召回 → 过滤 → 排序 → 重排/多样性 → 曝光 ｜ 每个阶段标注关键算法与降级策略</text>

  <!-- ============ 冷启动双塔路由 ============ -->
  <rect x="50" y="92" width="1140" height="126" rx="10" fill="#1a1205" stroke="#f0883e" stroke-width="1.6"/>
  <text x="70" y="118" fill="#f0883e" font-size="16" font-weight="700">冷启动双塔路由（Cold-start Dual-Tower Router）</text>
  <text x="70" y="138" fill="#c9a24d" font-size="12">特征缺失 → 走内容/先验路径；行为充足 → 走协同/深度路径</text>

  <!-- 用户塔 -->
  <rect x="80" y="150" width="300" height="54" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.4"/>
  <text x="230" y="171" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">新用户塔 User Tower</text>
  <text x="230" y="191" fill="#8b949e" font-size="11" text-anchor="middle">地域 / 设备 / 首屏引导 / 关注先验</text>

  <!-- ANN -->
  <rect x="450" y="150" width="300" height="54" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="600" y="171" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">ANN 近邻检索（FAISS / HNSW）</text>
  <text x="600" y="191" fill="#8b949e" font-size="11" text-anchor="middle">内积 / 余弦匹配，毫秒级召回</text>
  <line x1="380" y1="177" x2="446" y2="177" stroke="#f0883e" stroke-width="1.6" marker-end="url(#arrowO)"/>

  <!-- 物品塔 -->
  <rect x="820" y="150" width="340" height="54" rx="8" fill="#161b22" stroke="#bc8cff" stroke-width="1.4"/>
  <text x="990" y="171" fill="#bc8cff" font-size="13" font-weight="700" text-anchor="middle">新视频/物品塔 Item Tower</text>
  <text x="990" y="191" fill="#8b949e" font-size="11" text-anchor="middle">标签 / 音频指纹 / 封面画面 embedding</text>
  <line x1="756" y1="177" x2="816" y2="177" stroke="#f0883e" stroke-width="1.6" marker-end="url(#arrowO)"/>

  <!-- 双塔到召回池 -->
  <line x1="600" y1="218" x2="600" y2="248" stroke="#f0883e" stroke-width="1.8" marker-end="url(#arrowO)"/>
  <text x="612" y="238" fill="#c9a24d" font-size="11">→ 候选召回池</text>

  <!-- ============ 主流水线 ============ -->
  <!-- 阶段 1：候选召回 -->
  <rect x="50" y="258" width="220" height="300" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="160" y="284" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">① 候选召回</text>
  <text x="160" y="302" fill="#8b949e" font-size="11" text-anchor="middle">约 500 条 · Recall 优先</text>
  <rect x="62" y="312" width="196" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="160" y="337" fill="#e6edf3" font-size="12" text-anchor="middle">R1 item-item 协同过滤</text>
  <rect x="62" y="358" width="196" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="160" y="383" fill="#e6edf3" font-size="12" text-anchor="middle">R2 创作者关注（社交）</text>
  <rect x="62" y="404" width="196" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="160" y="429" fill="#e6edf3" font-size="12" text-anchor="middle">R3 热门新鲜（时间衰减）</text>
  <rect x="62" y="450" width="196" height="40" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="160" y="475" fill="#e6edf3" font-size="12" text-anchor="middle">R4 标签内容匹配</text>
  <rect x="62" y="496" width="196" height="40" rx="6" fill="#0d1117" stroke="#f0883e" stroke-dasharray="4 3"/>
  <text x="160" y="521" fill="#f0883e" font-size="12" text-anchor="middle">R5 冷启动兜底</text>
  <text x="160" y="548" fill="#8b949e" font-size="10.5" text-anchor="middle">多路融合：归一化 + 加权 α_p</text>

  <line x1="270" y1="408" x2="298" y2="408" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 阶段 2：过滤 -->
  <rect x="302" y="258" width="120" height="300" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="1.6"/>
  <text x="362" y="284" fill="#58a6ff" font-size="15" font-weight="700" text-anchor="middle">② 过滤</text>
  <text x="362" y="330" fill="#e6edf3" font-size="11.5" text-anchor="middle">已曝光去重</text>
  <text x="362" y="368" fill="#e6edf3" font-size="11.5" text-anchor="middle">黑名单/风控</text>
  <text x="362" y="406" fill="#e6edf3" font-size="11.5" text-anchor="middle">地域/年龄</text>
  <text x="362" y="444" fill="#e6edf3" font-size="11.5" text-anchor="middle">断链/下架</text>
  <text x="362" y="482" fill="#e6edf3" font-size="11.5" text-anchor="middle">近似去重</text>
  <text x="362" y="520" fill="#8b949e" font-size="10.5" text-anchor="middle">(SimHash/pHash)</text>

  <line x1="422" y1="408" x2="450" y2="408" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 阶段 3：排序 -->
  <rect x="454" y="258" width="252" height="300" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.6"/>
  <text x="580" y="284" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">③ 排序（Ranking）</text>
  <text x="580" y="302" fill="#8b949e" font-size="11" text-anchor="middle">500 → 200 · Precision 优先</text>
  <rect x="468" y="314" width="224" height="66" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="580" y="336" fill="#e6edf3" font-size="11.5" text-anchor="middle">线性加权基线</text>
  <text x="580" y="355" fill="#7ee787" font-size="10.5" text-anchor="middle">S = 0.45·Aff + 0.20·Pop + 0.15·Fresh</text>
  <text x="580" y="372" fill="#7ee787" font-size="10.5" text-anchor="middle">+ 0.10·Social + 0.10·Qual</text>
  <text x="580" y="404" fill="#e6edf3" font-size="11.5" text-anchor="middle">特征：用户 / 物品 / 上下文交叉</text>
  <text x="580" y="430" fill="#e6edf3" font-size="11.5" text-anchor="middle">多目标：P(完播/点赞/分享/关注)</text>
  <text x="580" y="456" fill="#8b949e" font-size="10.5" text-anchor="middle">─ 升级路径 ─</text>
  <text x="580" y="478" fill="#e6edf3" font-size="11.5" text-anchor="middle">LR → GBDT → Wide&amp;Deep</text>
  <text x="580" y="500" fill="#e6edf3" font-size="11.5" text-anchor="middle">→ 双塔召回 + 多任务(MMoE)</text>
  <text x="580" y="530" fill="#8b949e" font-size="10.5" text-anchor="middle">观看时长加权逻辑回归 / example age</text>

  <line x1="706" y1="408" x2="734" y2="408" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 阶段 4：重排 -->
  <rect x="738" y="258" width="262" height="300" rx="10" fill="#161b22" stroke="#bc8cff" stroke-width="1.6"/>
  <text x="869" y="284" fill="#bc8cff" font-size="15" font-weight="700" text-anchor="middle">④ 重排 / 多样性</text>
  <text x="869" y="302" fill="#8b949e" font-size="11" text-anchor="middle">200 → N · 体验与生态优先</text>
  <rect x="752" y="314" width="234" height="58" rx="6" fill="#0d1117" stroke="#bc8cff"/>
  <text x="869" y="336" fill="#e6edf3" font-size="11.5" text-anchor="middle">MMR 最大边际相关</text>
  <text x="869" y="356" fill="#d2a8ff" font-size="10.5" text-anchor="middle">λ·Rel − (1−λ)·maxSim(i,j)</text>
  <text x="869" y="392" fill="#e6edf3" font-size="11.5" text-anchor="middle">创作者打散（窗口 / 配额）</text>
  <text x="869" y="418" fill="#e6edf3" font-size="11.5" text-anchor="middle">新鲜度衰减二次施加</text>
  <text x="869" y="444" fill="#e6edf3" font-size="11.5" text-anchor="middle">去重（id / 近似 / 疲劳）</text>
  <text x="869" y="470" fill="#e6edf3" font-size="11.5" text-anchor="middle">探索-利用：ε-greedy / Thompson</text>
  <text x="869" y="496" fill="#8b949e" font-size="10.5" text-anchor="middle">λ=0.7，ε=0.1→退火 0.02</text>
  <text x="869" y="530" fill="#8b949e" font-size="10.5" text-anchor="middle">护栏：举报率 / Gini 集中度</text>

  <line x1="1000" y1="408" x2="1028" y2="408" stroke="#bc8cff" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- 阶段 5：曝光 -->
  <rect x="1032" y="258" width="158" height="300" rx="10" fill="#161b22" stroke="#e3b341" stroke-width="1.6"/>
  <text x="1111" y="284" fill="#e3b341" font-size="15" font-weight="700" text-anchor="middle">⑤ 曝光</text>
  <text x="1111" y="302" fill="#8b949e" font-size="11" text-anchor="middle">Feed 竖滑</text>
  <rect x="1046" y="320" width="130" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="1111" y="340" fill="#e6edf3" font-size="11" text-anchor="middle">第 1 位</text>
  <rect x="1046" y="356" width="130" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="1111" y="376" fill="#e6edf3" font-size="11" text-anchor="middle">第 2 位</text>
  <rect x="1046" y="392" width="130" height="30" rx="5" fill="#0d1117" stroke="#f0883e" stroke-dasharray="4 3"/>
  <text x="1111" y="412" fill="#f0883e" font-size="11" text-anchor="middle">第 3/4 位（探索）</text>
  <rect x="1046" y="428" width="130" height="30" rx="5" fill="#0d1117" stroke="#30363d"/>
  <text x="1111" y="448" fill="#e6edf3" font-size="11" text-anchor="middle">… 第 N 位</text>
  <text x="1111" y="486" fill="#8b949e" font-size="10.5" text-anchor="middle">N ≈ 10</text>
  <text x="1111" y="508" fill="#8b949e" font-size="10.5" text-anchor="middle">P99 ≤ 110ms</text>

  <!-- ============ 底部：闭环支撑 ============ -->
  <rect x="50" y="592" width="360" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="230" y="618" fill="#58a6ff" font-size="13" font-weight="700" text-anchor="middle">在线服务 / 特征平台</text>
  <text x="230" y="642" fill="#8b949e" font-size="11" text-anchor="middle">Redis 特征 · ZSET 倒排 · 向量库</text>
  <text x="230" y="662" fill="#8b949e" font-size="11" text-anchor="middle">特征与模型版本绑定，防不一致</text>
  <text x="230" y="682" fill="#8b949e" font-size="11" text-anchor="middle">降级：单路超时跳过 + 热门补齐</text>

  <rect x="440" y="592" width="360" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="620" y="618" fill="#3fb950" font-size="13" font-weight="700" text-anchor="middle">日志回流 / 训练闭环</text>
  <text x="620" y="642" fill="#8b949e" font-size="11" text-anchor="middle">曝光/完播/互动 → Kafka → 数据湖</text>
  <text x="620" y="662" fill="#8b949e" font-size="11" text-anchor="middle">按时间切分训练，避免特征穿越</text>
  <text x="620" y="682" fill="#8b949e" font-size="11" text-anchor="middle">正负样本 1:4~1:10 + 时长加权</text>

  <rect x="830" y="592" width="360" height="104" rx="10" fill="#161b22" stroke="#30363d"/>
  <text x="1010" y="618" fill="#e3b341" font-size="13" font-weight="700" text-anchor="middle">监控 / 评测体系</text>
  <text x="1010" y="642" fill="#8b949e" font-size="11" text-anchor="middle">离线：Recall@K · NDCG@K · AUC</text>
  <text x="1010" y="662" fill="#8b949e" font-size="11" text-anchor="middle">在线：完播率 · 人均时长 · 次日留存</text>
  <text x="1010" y="682" fill="#8b949e" font-size="11" text-anchor="middle">护栏：举报率 · 跳过率 · Gini 集中度</text>

  <!-- 回流虚线：曝光 → 日志 → 特征/模型 -->
  <path d="M 1111 558 L 1111 572 L 1010 572 L 1010 592" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <path d="M 830 644 L 800 644 L 800 460 L 706 460" fill="none" stroke="#8b949e" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowG)"/>
  <text x="806" y="628" fill="#8b949e" font-size="10.5">特征/模型更新回流</text>

  <!-- 图注 -->
  <text x="50" y="732" fill="#6e7681" font-size="11">图注：① 召回负责“广”（提高 Recall），②③ 排序负责“准”（提高 Precision），④ 重排负责“稳”（多样性、新鲜度、探索-利用、护栏），⑤ 曝光并回收行为日志形成闭环。</text>
  <text x="50" y="754" fill="#6e7681" font-size="11">冷启动双塔：新用户塔 × 新视频塔 经 ANN 近邻检索生成候选，解决无行为数据时的“无货可推”。</text>
  <text x="50" y="776" fill="#6e7681" font-size="11">颜色：蓝=召回/过滤，绿=排序，紫=重排，黄=曝光，橙=冷启动/探索，灰=支撑与回流。</text>
</svg>
